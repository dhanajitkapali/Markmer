name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build release zip
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: Tools/release.sh "${GITHUB_REF_NAME#v}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=("dist/Markmer-$version.zip" "dist/Markmer-$version.zip.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release was created on github.com (which also created the tag): attach assets to it.
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            notes="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
            if ! grep -q "## Install" <<<"$notes"; then
              printf '%s\n\n%s\n' "$notes" "$(cat .github/release-notes-footer.md)" > /tmp/notes.md
              gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Markmer $version" \
              --generate-notes \
              --notes-file .github/release-notes-footer.md
          fi
