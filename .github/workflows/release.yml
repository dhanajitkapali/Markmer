name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build release zip
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: Tools/release.sh "${GITHUB_REF_NAME#v}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=("dist/Markmer-$version.zip" "dist/Markmer-$version.zip.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Release was created on github.com (which also created the tag): attach assets to it.
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            notes="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
            if ! grep -q "## Install" <<<"$notes"; then
              printf '%s\n\n%s\n' "$notes" "$(cat .github/release-notes-footer.md)" > /tmp/notes.md
              gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Markmer $version" \
              --generate-notes \
              --notes-file .github/release-notes-footer.md
          fi

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN secret not set; skipping cask update."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          sha="$(cut -d' ' -f1 "dist/Markmer-$version.zip.sha256")"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/dhanajitkapali/homebrew-tap.git" tap
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$version\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" \
            tap/Casks/markmer.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/markmer.rb
          git diff --cached --quiet && { echo "Cask already up to date."; exit 0; }
          git commit -m "markmer $version"
          git push
